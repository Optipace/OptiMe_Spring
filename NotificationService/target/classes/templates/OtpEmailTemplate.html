<!DOCTYPE html>
<html xmlns:th="[http://www.thymeleag.org](http://www.thymeleaf.org)">
<head>
    <style>
        .container { font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 25px; }
        .header-title { color: #1a73e8; font-size: 24px; margin: 0; }
        .otp-box { font-size: 34px; font-weight: bold; color: #1a73e8; letter-spacing: 8px; padding: 14px 32px; background: #f5f8ff; border: 2px dashed #1a73e8; border-radius: 8px; }
        .logo { width: 50px; height: 50px; margin-right: 12px; vertical-align: middle; }
    </style>
</head>
<body>
<div class="container">
    <div style="display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
        <!-- Thymeleaf works perfectly with MimeMessageHelper inline images! -->
        <img class="logo" src="cid:logo" alt="Optipace Logo">
        <h2 class="header-title">Optipace Technologies</h2>
    </div>
    <hr>
    <p>Hello,</p>
    <p>Use the verification code below to complete your registration session. This One-Time Password (OTP) is confidential.</p>

    <div style="text-align:center; margin:35px 0;">
        <!-- This is where Thymeleaf injects your OTP code! -->
        <span class="otp-box" th:text="${otpCode}">000000</span>
    </div>

    <p style="font-size:14px;color:#666;font-style:italic;text-align:center;">Note: This code is valid for <strong th:text="${validMinutes}+' minutes'">5 minutes</strong> only.</p>
    <hr style="border:none; border-top:1px solid #e0e0e0;margin-top:30px;margin-bottom:15px;">
    <p style="font-size:12px;color:#999;text-align:center;">
    This is an automated operational system email.<br>
    Please do not reply directly to this message.
    </p>
</div>
</body>
</html>
