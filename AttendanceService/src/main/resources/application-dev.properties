# ====================
# Server Configuration
# ====================
spring.application.name=ATTENDANCE-SERVICE
#server.port=7074
server.port=0
server.address=0.0.0.0

# =================================
# PostgreSQL database configuration
# =================================
spring.datasource.url=jdbc:postgresql://localhost:5432/developmentattendanceservicedb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================
# Hibernate settings
# ===================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=9d583de3633b4c475e7e50b67d3bc39749fde10398df52e2ccf299a415f85840

jwt.expirationMs=1800000

app.image.upload-dir=C:/Users/medini/Desktop/Employee/image/

# ===========================
# Eureka Client Configuration
# ===========================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#Change to 8761
eureka.client.service-url.defaultZone=http://localhost:8700/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Cap the maximum database connections this microservice can claim
spring.datasource.hikari.maximum-pool-size=4
# Keep a minimum of 2 connections ready in the pool idle loop
spring.datasource.hikari.minimum-idle=2
# Time out fast if no connection is available rather than hanging
spring.datasource.hikari.connection-timeout=15000