# 1. Server configuration
spring.application.name=API-GATEWAY

# 2. Route 1: Auth Service Configuration
spring.cloud.gateway.routes[0].id = AUTH-SERVICE
spring.cloud.gateway.routes[0].uri = http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0] = Path = /api/auth/**

# 3. Route 2: Employee Profile Service Configuration
spring.cloud.gateway.routes[1].id = EMPLOYEE-SERVICE
spring.cloud.gateway.routes[1].uri = http://localhost:8082
spring.cloud.gateway.routes[1].predicates[1] = Path = /api/employee/**

jwt.secret = 9d583de3633b4c475e7e50b67d3bc39749fde10398df52e2ccf299a415f85840

jwt.expirationMs = 1800000

# This tells the gateway to run our custom AuthenticationFilter before routing
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter